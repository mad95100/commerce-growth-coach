<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bande de sous-titres</title>
<link rel="stylesheet" href="polices.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:transparent}
  /* La bande vit sous le contenu de la scène (qui s'arrête à 1450 px) et
     au-dessus de la zone que TikTok recouvre de sa légende (à partir de 1600 px). */
  #bande{position:absolute;left:0;right:0;bottom:330px;display:flex;justify-content:center}
  #texte{font-family:"Public Sans","DejaVu Sans",sans-serif;font-weight:700;
         font-size:41px;line-height:1.3;letter-spacing:-.005em;color:#F4F3EE;
         background:rgba(8,9,11,.74);border-radius:14px;padding:15px 28px;
         white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.55)}
</style>
</head>
<body><div id="bande"><span id="texte"></span></div></body>
</html>
