name: CI

# Sur chaque PR et chaque poussée sur main. Rien d'autre : le but est de tenir
# les garanties, pas de consommer des minutes de calcul.
on:
  pull_request:
  push:
    branches: [main]

# Une PR mise à jour annule la vérification précédente, devenue caduque.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Tests — délibérément indépendants de l'installation complète
  # ---------------------------------------------------------------------------
  # Les tests n'ont besoin que de `jiti` (chargement TypeScript) et de `zod`
  # (schémas de validation exercés par les garde-fous). Les installer seuls rend
  # ce travail rapide et indépendant du reste de la chaîne : il se prononce même
  # si l'installation complète échoue.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `jiti` et `zod` suffisent aux tests. Ils sont installés seuls plutôt que
      # par une installation complète : ce travail garde ainsi un verdict même
      # si l'installation intégrale casse pour une raison sans rapport.
      - name: Installer les seules dépendances nécessaires aux tests
        run: npm install --no-save --no-audit --no-fund jiti@^2.6.1 zod@^3.24.2

      - name: Suite complète
        run: npm test

  # ---------------------------------------------------------------------------
  # Typage et style — nécessitent l'installation complète
  # ---------------------------------------------------------------------------
  quality:
    name: Typage et style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Typage
        run: bun run typecheck

      - name: Style
        run: bun run lint

  # ---------------------------------------------------------------------------
  # Build — la seule preuve que le dépôt est déployable
  # ---------------------------------------------------------------------------
  # Le typage et le lint ne disent rien de l'assemblage. Une erreur de
  # configuration de build ne se manifeste qu'ici, et le déploiement en dépend
  # directement : `deploy.yml` ne part que si cette CI est verte.
  build:
    name: Build Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Construire
        run: bun run build

      - name: La sortie est celle qu'attend wrangler
        run: |
          # Ces chemins sont ceux déclarés dans wrangler.toml. S'ils changent
          # sans que wrangler.toml suive, le déploiement produit un worker vide.
          test -f .output/server/index.mjs || { echo "::error::.output/server/index.mjs absent"; exit 1; }
          test -d .output/public || { echo "::error::.output/public absent"; exit 1; }
          echo "Sortie de build conforme."

      - name: Le déclencheur planifié est bien embarqué
        run: |
          # Le cron est ce qui fait vivre les audits sans navigateur. S'il
          # disparaît du bundle, rien n'échoue — les audits restent simplement
          # en attente pour toujours.
          grep -q "cloudflare:scheduled" .output/server/index.mjs \
            || { echo "::error::Le greffon du cron n'est pas dans le worker."; exit 1; }
          echo "Déclencheur planifié présent."

      - name: Aucune trace de Lovable dans le worker livré
        run: |
          # Le contrôle définitif : il porte sur le code réellement exécuté en
          # production, pas sur les sources.
          #
          # DEUX NIVEAUX, parce que la bascule n'est pas terminée. Les deux
          # replis transitoires (`LEGACY_ORIGIN`, `LEGACY_BASE_URL`) doivent
          # rester le temps que la production migre : sans eux, la fusion dans
          # `main` casserait l'OAuth Shopify et les audits sur le déploiement
          # actuel, où `APP_URL` et `AI_BASE_URL` ne sont pas renseignées.
          # Ils sont donc tolérés — mais UNIQUEMENT dans les deux modules qui
          # les portent, et cette tolérance disparaît avec eux à la coupure.

          # Niveau 1 — jamais tolérés, nulle part : SDK, paquets, crochets.
          INTERDITS='@lovable\.dev/|createLovableAuth|__lovableEvents|__lovableReportRuntimeError|lovable-core-prod'
          if grep -rlE "$INTERDITS" .output/server .output/public 2>/dev/null | grep -q .; then
            echo "::error::Un SDK ou un paquet Lovable est présent dans la sortie de build."
            grep -rlE "$INTERDITS" .output/server .output/public
            exit 1
          fi

          # Niveau 2 — URL et variable héritées, admises seulement dans les
          # modules de repli nommés.
          INATTENDUS=$(grep -rlE "lovable\.(dev|app)|LOVABLE_API_KEY" .output/server .output/public 2>/dev/null \
            | grep -vE '/(ai-gateway\.server|public-origin\.server)[.-]' || true)
          if [ -n "$INATTENDUS" ]; then
            echo "::error::Une référence Lovable apparaît hors des modules de repli déclarés."
            echo "$INATTENDUS"
            exit 1
          fi

          echo "Aucun SDK Lovable. Références héritées confinées aux deux modules de repli."

  # ---------------------------------------------------------------------------
  # Contrôles de sécurité structurels
  # ---------------------------------------------------------------------------
  # Ces vérifications ne peuvent pas être laissées à la seule relecture : elles
  # portent sur des invariants qu'une modification bien intentionnée casse
  # facilement, et dont la rupture ne se voit pas à l'exécution.
  security:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aucun secret versionné
        run: |
          # `.env` est suivi par git et ne doit contenir que des valeurs
          # publiques. Un secret serveur qui y atterrit part dans l'historique,
          # d'où on ne le retire plus.
          FORBIDDEN='SHOPIFY_CLIENT_SECRET|OAUTH_STATE_SECRET|DATA_CONNECTIONS_ENCRYPTION_KEY|SUPABASE_SERVICE_ROLE_KEY|AI_API_KEY|JOBS_TICK_SECRET|LOVABLE_API_KEY|GOOGLE_CLIENT_SECRET|META_CLIENT_SECRET|GOOGLE_ADS_DEVELOPER_TOKEN'
          if [ -f .env ] && grep -qE "^\s*(export\s+)?($FORBIDDEN)\s*=\s*\S" .env; then
            echo "::error file=.env::Un secret serveur est renseigné dans .env, qui est versionné."
            exit 1
          fi
          echo "Aucun secret serveur renseigné dans un fichier versionné."

      - name: Les jetons partenaires ne sont pas exposés au navigateur
        run: |
          # Les colonnes de jetons ne doivent jamais figurer dans un droit de
          # lecture accordé au rôle `authenticated`, ni être demandées par du
          # code qui s'exécute dans le navigateur.
          if grep -rn "access_token_ciphertext\|refresh_token_ciphertext" src/components src/routes/_authenticated 2>/dev/null; then
            echo "::error::Une colonne de jeton est référencée par du code client."
            exit 1
          fi
          echo "Aucune colonne de jeton référencée côté navigateur."

      # L'invariant « toute écriture sensible passe par le rôle de service » est
      # vérifié par la suite tests/security/rls.test.ts, qui analyse les sources
      # en multiligne et sait distinguer un module recevant son client en
      # paramètre. Le refaire ici en shell donnerait un contrôle plus faible et
      # deux endroits à maintenir.

      - name: L'inventaire des tests est intact
        run: |
          # Le lanceur vérifie déjà les effectifs à l'exécution. Ce contrôle-ci
          # attrape le cas où l'inventaire lui-même serait vidé pour faire
          # passer la CI.
          COUNT=$(grep -c 'file: "' tests/expected.ts)
          if [ "$COUNT" -lt 15 ]; then
            echo "::error file=tests/expected.ts::L'inventaire ne déclare plus que $COUNT suites, 15 attendues."
            exit 1
          fi
          echo "$COUNT suites déclarées dans l'inventaire."
