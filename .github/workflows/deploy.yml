name: Déploiement

# Le déploiement n'est JAMAIS déclenché par une PR : seul un `main` déjà validé
# part en production. `workflow_run` attend que la CI se soit prononcée, plutôt
# que de refaire ses contrôles ici — les refaire donnerait deux verdicts
# possibles pour un même commit.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Permet une reprise manuelle après un incident, sans avoir à repousser un
  # commit vide.
  workflow_dispatch:
    inputs:
      environment:
        description: "Cible du déploiement"
        required: true
        default: preview
        type: choice
        options: [preview, production]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Construire et déployer
    runs-on: ubuntu-latest
    # La condition couvre les deux déclencheurs : une CI rouge ne déploie rien,
    # un lancement manuel passe toujours.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: ${{ github.event.inputs.environment || 'production' }}

    # Déclarées au niveau du job : une condition `if` de step ne voit pas le
    # bloc `env:` de ce même step, et la condition serait toujours fausse.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          # `workflow_run` part par défaut sur la branche par défaut : on épingle
          # le commit exact qui vient d'être validé, sinon on pourrait déployer
          # autre chose que ce qui a été testé.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Les identifiants de déploiement sont présents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Sans ce contrôle, wrangler échoue plus loin sur « it's necessary to
          # set a CLOUDFLARE_API_TOKEN », un message qui n'indique pas OÙ le
          # renseigner — et le piège est réel : ces deux valeurs se placent dans
          # les secrets du DÉPÔT GITHUB, pas dans l'interface Cloudflare, qui ne
          # sert qu'à l'exécution du Worker.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret(s) absent(s) des secrets du dépôt GitHub : CLOUDFLARE_API_TOKEN"
            echo "::error::À ajouter dans Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

          # L'identifiant de compte est FACULTATIF : wrangler le déduit seul
          # quand le token ne donne accès qu'à un compte, ce qui est le cas
          # courant. Ne pas en faire un blocage évite d'immobiliser un
          # déploiement pour une valeur que la plateforme sait retrouver.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_ACCOUNT_ID non renseigné — wrangler déduira le compte depuis le token."
            echo "::notice::À renseigner seulement si le token porte sur plusieurs comptes."
          fi
          echo "Identifiants de déploiement présents."

      - name: Construire
        run: bun run build

      - name: Vérifier que la sortie de build existe
        run: |
          # Un déploiement d'un dossier vide réussit côté wrangler et sert des
          # 404 : mieux vaut échouer ici, bruyamment.
          test -f .output/server/index.mjs || { echo "::error::.output/server/index.mjs absent"; exit 1; }
          test -d .output/public || { echo "::error::.output/public absent"; exit 1; }

      - name: Déployer sur Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ (github.event.inputs.environment == 'preview') && '--env preview' || '--env=' }}
        run: |
          # Appel direct plutôt que `cloudflare/wrangler-action` : l'action
          # exporte l'identifiant de compte même vide, ce qui fait échouer
          # wrangler au lieu de le laisser déduire le compte. Ici, une variable
          # vide est simplement retirée de l'environnement.
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID

          # `--env=` (valeur vide) désigne explicitement l'environnement de
          # tête. Sans lui, wrangler avertit que plusieurs environnements sont
          # définis sans cible — ambiguïté qu'on ne veut pas ici.
          #
          # LA VALEUR NE DOIT PAS PORTER DE GUILLEMETS. Écrite `--env=""`, elle
          # part d'une variable : le shell ne retire pas les guillemets à
          # l'expansion, et wrangler reçoit un nom d'environnement littéral
          # `""` qu'il ne trouve pas. En ligne de commande directe les
          # guillemets disparaissent, ce qui rendait le défaut invisible en
          # local.
          bunx wrangler deploy $WRANGLER_ENV

      - name: Provisionner les secrets d'exécution du Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ (github.event.inputs.environment == 'preview') && '--env preview' || '--env=' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_CONNECTIONS_ENCRYPTION_KEY: ${{ secrets.DATA_CONNECTIONS_ENCRYPTION_KEY }}
          OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          JOBS_TICK_SECRET: ${{ secrets.JOBS_TICK_SECRET }}
          META_CLIENT_ID: ${{ secrets.META_CLIENT_ID }}
          META_CLIENT_SECRET: ${{ secrets.META_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          # POURQUOI CETTE ÉTAPE. Un Worker fraîchement déployé n'a aucun secret :
          # le rendu serveur, l'OAuth et les audits échoueraient tous. Les
          # renseigner à la main dans l'interface Cloudflare marcherait, mais il
          # faudrait recommencer à chaque nouvel environnement. Ils sont donc
          # déclarés une seule fois dans les secrets du dépôt et poussés d'ici.
          #
          # AUCUNE VALEUR N'EST AFFICHÉE : le JSON est construit par `jq` depuis
          # l'environnement, puis lu par wrangler sur son entrée standard. Rien
          # ne transite par la ligne de commande ni par les journaux.
          #
          # Un secret non renseigné est simplement OMIS, jamais écrit à vide :
          # `secret bulk` ne touche pas aux clés absentes du JSON, donc une
          # valeur déjà posée sur le Worker survit à un déploiement.
          NOMS="SUPABASE_SERVICE_ROLE_KEY DATA_CONNECTIONS_ENCRYPTION_KEY OAUTH_STATE_SECRET
                SHOPIFY_CLIENT_ID SHOPIFY_CLIENT_SECRET AI_API_KEY JOBS_TICK_SECRET
                META_CLIENT_ID META_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
                GOOGLE_ADS_DEVELOPER_TOKEN GOOGLE_ADS_LOGIN_CUSTOMER_ID"

          presents=""
          absents=""
          for nom in $NOMS; do
            if [ -n "$(printenv "$nom" || true)" ]; then
              presents="$presents $nom"
            else
              absents="$absents $nom"
            fi
          done

          [ -n "$absents" ] && echo "::warning::Secrets non fournis, laissés inchangés sur le Worker :$absents"

          if [ -z "$presents" ]; then
            echo "::warning::Aucun secret d'exécution fourni. Le Worker est déployé mais ne pourra pas joindre Supabase."
            exit 0
          fi

          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID

          echo "Secrets à provisionner :$presents"
          jq -n '[$ENV | to_entries[] | select(.key as $k | $noms | index($k)) | select(.value != "")] | from_entries' \
            --argjson noms "$(printf '%s\n' $presents | jq -R . | jq -s .)" \
            | bunx wrangler secret bulk $WRANGLER_ENV

          echo "Secrets d'exécution provisionnés."

      - name: Générer les secrets qui peuvent l'être
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ (github.event.inputs.environment == 'preview') && '--env preview' || '--env=' }}
          OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET }}
          JOBS_TICK_SECRET: ${{ secrets.JOBS_TICK_SECRET }}
          DATA_CONNECTIONS_ENCRYPTION_KEY: ${{ secrets.DATA_CONNECTIONS_ENCRYPTION_KEY }}
        run: |
          # TROIS SECRETS N'ONT PAS DE VALEUR « JUSTE ». Le serveur a seulement
          # besoin qu'elle soit stable : `OAUTH_STATE_SECRET` signe le paramètre
          # `state` d'un parcours OAuth qui expire en 15 minutes,
          # `JOBS_TICK_SECRET` protège le déclencheur HTTP des travaux, et
          # `DATA_CONNECTIONS_ENCRYPTION_KEY` chiffre les jetons partenaires.
          # Les faire attendre une saisie humaine n'apporte rien : ils sont
          # générés ici s'ils manquent.
          #
          # TROIS RÈGLES, DANS CET ORDRE :
          #   1. une valeur fournie dans les secrets du dépôt gagne toujours —
          #      c'est ainsi qu'on réinjecte une clé de chiffrement retrouvée ;
          #   2. une valeur DÉJÀ POSÉE sur le Worker n'est jamais remplacée —
          #      sans cette règle, chaque déploiement ferait tourner la clé de
          #      chiffrement et rendrait illisibles les jetons de la veille ;
          #   3. sinon seulement, on génère.
          #
          # Aucune valeur n'est affichée : `openssl` écrit dans une variable,
          # `jq` construit le JSON, wrangler le lit sur son entrée standard.
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID

          deja=$(bunx wrangler secret list $WRANGLER_ENV --format json 2>/dev/null \
                 | jq -r '.[].name' 2>/dev/null || true)

          a_generer=""
          for nom in OAUTH_STATE_SECRET JOBS_TICK_SECRET DATA_CONNECTIONS_ENCRYPTION_KEY; do
            if [ -n "$(printenv "$nom" || true)" ]; then
              echo "$nom : fourni par les secrets du dépôt, prioritaire."
            elif echo "$deja" | grep -qx "$nom"; then
              echo "$nom : déjà posé sur le Worker, laissé intact."
            else
              a_generer="$a_generer $nom"
            fi
          done

          if [ -z "$a_generer" ]; then
            echo "Rien à générer."
            exit 0
          fi

          echo "Génération :$a_generer"
          for nom in $a_generer; do
            export "$nom=$(openssl rand -base64 32)"
          done

          jq -n '[$ENV | to_entries[] | select(.key as $k | $noms | index($k))] | from_entries' \
            --argjson noms "$(printf '%s\n' $a_generer | jq -R . | jq -s .)" \
            | bunx wrangler secret bulk $WRANGLER_ENV

          echo "::notice::Secrets générés :$a_generer — ils ne seront plus régénérés aux déploiements suivants."

      - name: Appliquer les migrations Supabase
        # APRÈS le déploiement, délibérément : on ne modifie le schéma qu'une
        # fois le worker publié sans erreur. Sautée si le projet n'est pas relié.
        if: env.SUPABASE_ACCESS_TOKEN != '' && vars.SUPABASE_PROJECT_ID != ''
        env:
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          npm install -g supabase@latest
          supabase link --project-ref "$PROJECT_ID"

          # L'historique local et distant DOIVENT concorder. Un décalage d'une
          # seule seconde sur un horodatage suffit à faire rejouer la migration
          # initiale — donc à réexécuter des CREATE TYPE sur un schéma déjà en
          # place, et à casser le déploiement. Le cas s'est produit.
          echo "--- État des migrations ---"
          supabase migration list

          # Annonce ce qui va être appliqué avant de l'appliquer : la trace
          # reste dans le journal du déploiement.
          echo "--- Migrations qui vont être appliquées ---"
          supabase db push --dry-run

          # N'applique QUE les migrations absentes de
          # `supabase_migrations.schema_migrations`. Ne recrée rien, ne rejoue
          # rien, ne touche à aucune donnée.
          supabase db push

      - name: Contrôle de démarrage
        env:
          TARGET: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
        run: |
          # Un worker peut se déployer et refuser de démarrer — module manquant,
          # variable absente. On le vérifie plutôt que de le supposer.
          if [ -z "$TARGET" ]; then
            echo "::notice::DEPLOY_HEALTHCHECK_URL non renseignée, contrôle sauté."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TARGET" || echo 000)
            echo "tentative $attempt : HTTP $code"
            case "$code" in
              2*|3*) echo "Déploiement joignable."; exit 0 ;;
            esac
            sleep 6
          done
          echo "::error::Le déploiement ne répond pas correctement ($TARGET)."
          exit 1
